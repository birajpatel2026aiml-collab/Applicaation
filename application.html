
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibrant Unit Converter</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Animated Mesh Background Blobs */
        @keyframes floatSlow {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(35px, -45px) scale(1.08); }
            66% { transform: translate(-25px, 25px) scale(0.94); }
        }
        @keyframes floatReverse {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-40px, 35px) scale(1.06); }
        }
        .animate-blob-1 { animation: floatSlow 14s ease-in-out infinite; }
        .animate-blob-2 { animation: floatReverse 18s ease-in-out infinite; }
        .animate-blob-3 { animation: floatSlow 20s ease-in-out infinite 2s; }

        /* Clean Number Input Arrows Removal */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body id="app-body" class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative overflow-x-hidden bg-gradient-to-br from-rose-50 via-orange-50 to-amber-100 text-slate-900 transition-colors duration-700 selection:bg-slate-900 selection:text-white">

    <!-- Decorative Animated Ambient Gradient Orbs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0" aria-hidden="true">
        <div id="orb-1" class="animate-blob-1 absolute -top-24 -left-24 w-96 h-96 rounded-full bg-gradient-to-tr from-rose-400/40 to-orange-300/40 blur-3xl transition-all duration-700"></div>
        <div id="orb-2" class="animate-blob-2 absolute top-1/2 -right-24 w-[28rem] h-[28rem] rounded-full bg-gradient-to-bl from-amber-400/35 to-pink-400/35 blur-3xl transition-all duration-700"></div>
        <div id="orb-3" class="animate-blob-3 absolute -bottom-24 left-1/3 w-80 h-80 rounded-full bg-gradient-to-r from-orange-400/30 to-red-300/30 blur-3xl transition-all duration-700"></div>
    </div>

    <!-- Main Glassmorphic Application Card -->

        <!-- Dynamic Colored Header Banner -->

            <!-- Subtle Glass Sheen Overlay -->
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.28),transparent_60%)] pointer-events-none"></div>
            
            <div class="relative z-10 flex items-center justify-between gap-4">
                <div>
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-xs font-semibold tracking-wide uppercase mb-2.5 border border-white/25">
                        <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                        <span id="theme-badge-text">Thermal Precision</span>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2.5 drop-shadow-xs">
                        Unit Converter
                    </h1>
                    <p class="text-white/90 text-sm mt-1 font-medium">Instant bidirectional conversions with live formulas</p>
                </div>

                <!-- Dynamic Category Hero Icon Badge -->
                <div id="header-icon-box" class="w-14 h-14 rounded-2xl bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center shadow-lg shrink-0 transition-transform duration-500">
                    <svg id="header-hero-icon" class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z"></path>
                    </svg>
                </div>
            </div>
        </header>

        <!-- Category Navigation Tabs -->
        <nav class="p-3 bg-slate-100/70 backdrop-blur-md border-b border-slate-200/60" aria-label="Conversion Categories">
            <div class="grid grid-cols-3 gap-2" role="tablist">
                <button type="button" role="tab" id="tab-temperature" data-category="temperature" aria-selected="true"
                    class="category-tab flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-sm font-bold transition-all duration-300">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z"></path>
                    </svg>
                    <span>Temperature</span>
                </button>

                <button type="button" role="tab" id="tab-length" data-category="length" aria-selected="false"

                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 6l12 12M6 6v4m0-4h4m8 12v-4m0 4h-4M9 9l2-2m2 6l2-2"></path>
                    </svg>
                    <span>Length</span>
                </button>

                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    </svg>
                    <span>Weight</span>
                </button>
            </div>
        </nav>

                    <span class="text-[11px] text-slate-400 font-medium">Tap to apply</span>
                </div>
                <div id="presets-container" class="flex flex-wrap gap-2">
                    <!-- Preset buttons injected dynamically -->
                </div>
            </div>

                formulaText: 'font-mono text-emerald-300 bg-slate-800/90 px-2.5 py-1 rounded-md border border-slate-700/70',
                presetPill: 'px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200/80 hover:bg-emerald-600 hover:text-white hover:border-emerald-600 active:scale-95 transition-all cursor-pointer',
                heroIconPath: 'M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3'
            }
        };

        /**
         * Unit Definitions, Conversion Factors & Quick Presets
         */
        const CONVERSION_DATA = {
            temperature: {
                defaultFrom: 'celsius',
                defaultTo: 'fahrenheit',
                defaultValue: 25,
                presets: [
                    { label: 'Freezing: 0 °C → °F', from: 'celsius', to: 'fahrenheit', val: 0 },
                    { label: 'Room: 25 °C → °F', from: 'celsius', to: 'fahrenheit', val: 25 },
                    { label: 'Body: 98.6 °F → °C', from: 'fahrenheit', to: 'celsius', val: 98.6 },
                    { label: 'Boiling: 100 °C → K', from: 'celsius', to: 'kelvin', val: 100 }
                ],
                units: {
                    celsius: { label: 'Celsius (°C)', symbol: '°C' },
                    fahrenheit: { label: 'Fahrenheit (°F)', symbol: '°F' },
                    kelvin: { label: 'Kelvin (K)', symbol: 'K' }
                }
            },
            length: {
                defaultFrom: 'meters',
                defaultTo: 'feet',
                defaultValue: 1,
                presets: [
                    { label: '1 m → ft', from: 'meters', to: 'feet', val: 1 },
                    { label: '5 km → mi', from: 'kilometers', to: 'miles', val: 5 },
                    { label: '12 in → cm', from: 'inches', to: 'centimeters', val: 12 },
                    { label: '100 yd → m', from: 'yards', to: 'meters', val: 100 }
                ],
                units: {
                    meters: { label: 'Meters (m)', symbol: 'm', toBase: 1 },
                    kilometers: { label: 'Kilometers (km)', symbol: 'km', toBase: 1000 },
                    centimeters: { label: 'Centimeters (cm)', symbol: 'cm', toBase: 0.01 },
                    millimeters: { label: 'Millimeters (mm)', symbol: 'mm', toBase: 0.001 },
                    miles: { label: 'Miles (mi)', symbol: 'mi', toBase: 1609.344 },
                    yards: { label: 'Yards (yd)', symbol: 'yd', toBase: 0.9144 },
                    feet: { label: 'Feet (ft)', symbol: 'ft', toBase: 0.3048 },
                    inches: { label: 'Inches (in)', symbol: 'in', toBase: 0.0254 }
                }
            },
            weight: {
                defaultFrom: 'kilograms',
                defaultTo: 'pounds',
                defaultValue: 1,
                presets: [
                    { label: '1 kg → lb', from: 'kilograms', to: 'pounds', val: 1 },
                    { label: '500 g → oz', from: 'grams', to: 'ounces', val: 500 },
                    { label: '150 lb → kg', from: 'pounds', to: 'kilograms', val: 150 },
                    { label: '1 t → kg', from: 'metricTons', to: 'kilograms', val: 1 }
                ],
                units: {
                    kilograms: { label: 'Kilograms (kg)', symbol: 'kg', toBase: 1 },
                    grams: { label: 'Grams (g)', symbol: 'g', toBase: 0.001 },
                    milligrams: { label: 'Milligrams (mg)', symbol: 'mg', toBase: 0.000001 },
                    metricTons: { label: 'Metric Tons (t)', symbol: 't', toBase: 1000 },
                    pounds: { label: 'Pounds (lb)', symbol: 'lb', toBase: 0.45359237 },
                    ounces: { label: 'Ounces (oz)', symbol: 'oz', toBase: 0.028349523125 }
                }
            }
        };

        // Application State
        let currentCategory = 'temperature';
        let lastEditedSide = 'from';
        let swapRotation = 0;

        // DOM Elements
        const appBody = document.getElementById('app-body');
        const orb1 = document.getElementById('orb-1');
        const orb2 = document.getElementById('orb-2');
        const orb3 = document.getElementById('orb-3');
        const cardHeader = document.getElementById('card-header');
        const themeBadgeText = document.getElementById('theme-badge-text');
        const headerHeroIcon = document.getElementById('header-hero-icon');
        const headerIconBox = document.getElementById('header-icon-box');
        const categoryTabs = document.querySelectorAll('.category-tab');
        const inputFrom = document.getElementById('input-from');
        const inputTo = document.getElementById('input-to');
        const selectFrom = document.getElementById('select-from');
        const selectTo = document.getElementById('select-to');
        const swapBtn = document.getElementById('swap-btn');
        const swapIcon = document.getElementById('swap-icon');
        const toCard = document.getElementById('to-card');
        const toLabel = document.getElementById('to-label');
        const fromDot = document.getElementById('from-dot');
        const toDot = document.getElementById('to-dot');
        const statusPulse = document.getElementById('status-pulse');
        const formulaBadge = document.getElementById('formula-badge');
        const presetsContainer = document.getElementById('presets-container');
        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const clearBtn = document.getElementById('clear-btn');
        const summaryEl = document.getElementById('conversion-summary');
        const toastEl = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        /**
         * Formats numbers cleanly without trailing zeroes or IEEE 754 floating-point artifacts
         */
        function formatNumber(num) {
            if (num === '' || num === null || isNaN(num) || !isFinite(num)) return '';
            const rounded = Math.round((num + Number.EPSILON) * 1e8) / 1e8;
            return String(rounded);
        }

        /**
         * Core conversion logic between any two units
         */
        function convertValue(value, fromUnit, toUnit, category) {
            if (isNaN(value)) return NaN;
            if (fromUnit === toUnit) return value;

            if (category === 'temperature') {
                let celsius;
                if (fromUnit === 'celsius') celsius = value;
                else if (fromUnit === 'fahrenheit') celsius = (value - 32) * (5 / 9);
                else if (fromUnit === 'kelvin') celsius = value - 273.15;

                if (toUnit === 'celsius') return celsius;
                if (toUnit === 'fahrenheit') return (celsius * 9 / 5) + 32;
                if (toUnit === 'kelvin') return celsius + 273.15;
            } else {
                const units = CONVERSION_DATA[category].units;
                const valueInBase = value * units[fromUnit].toBase;
                return valueInBase / units[toUnit].toBase;
            }
            return NaN;
        }

        /**
         * Generates a clear human-readable formula or unit multiplier string
         */
        function getFormulaDescription(fromUnit, toUnit, category) {
            const units = CONVERSION_DATA[category].units;
            const fromSym = units[fromUnit].symbol;
            const toSym = units[toUnit].symbol;

            if (fromUnit === toUnit) return `1 ${fromSym} = 1 ${toSym}`;

            if (category === 'temperature') {
                const formulas = {
                    'celsius_fahrenheit': '(°C × 9/5) + 32 = °F',
                    'fahrenheit_celsius': '(°F − 32) × 5/9 = °C',
                    'celsius_kelvin': '°C + 273.15 = K',
                    'kelvin_celsius': 'K − 273.15 = °C',
                    'fahrenheit_kelvin': '(°F − 32) × 5/9 + 273.15 = K',
                    'kelvin_fahrenheit': '(K − 273.15) × 9/5 + 32 = °F'
                };
                return formulas[`${fromUnit}_${toUnit}`] || '';
            } else {
                const factor = convertValue(1, fromUnit, toUnit, category);
                return `1 ${fromSym} = ${formatNumber(factor)} ${toSym}`;
            }
        }

        /**
         * Updates the summary text banner and formula badge
         */
        function updateSummary() {
            const units = CONVERSION_DATA[currentCategory].units;
            const fromUnit = selectFrom.value;
            const toUnit = selectTo.value;
            const valFrom = parseFloat(inputFrom.value);
            const valTo = parseFloat(inputTo.value);

            formulaBadge.textContent = getFormulaDescription(fromUnit, toUnit, currentCategory);

            if (isNaN(valFrom) || isNaN(valTo)) {
                summaryEl.textContent = 'Enter a number to convert';
                return;
            }

            summaryEl.textContent = `${formatNumber(valFrom)} ${units[fromUnit].symbol} = ${formatNumber(valTo)} ${units[toUnit].symbol}`;
        }

        /**
         * Performs real-time conversion based on which field was last edited
         */
        function handleConversion(source = lastEditedSide) {
            lastEditedSide = source;
            const fromUnit = selectFrom.value;
            const toUnit = selectTo.value;

            if (source === 'from') {
                const rawVal = inputFrom.value.trim();
                if (rawVal === '') {
                    inputTo.value = '';
                    updateSummary();
                    return;
                }
                const numVal = parseFloat(rawVal);
                const result = convertValue(numVal, fromUnit, toUnit, currentCategory);
                inputTo.value = formatNumber(result);
            } else {
                const rawVal = inputTo.value.trim();
                if (rawVal === '') {
                    inputFrom.value = '';
                    updateSummary();
                    return;
                }
                const numVal = parseFloat(rawVal);
                const result = convertValue(numVal, toUnit, fromUnit, currentCategory);
                inputFrom.value = formatNumber(result);
            }

            updateSummary();
        }

        /**
         * Renders quick preset pills tailored to the active category
         */
        function renderPresets(category) {
            const presets = CONVERSION_DATA[category].presets;
            const theme = CATEGORY_THEMES[category];
            presetsContainer.innerHTML = '';

            presets.forEach(preset => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = theme.presetPill;
                btn.textContent = preset.label;
                btn.addEventListener('click', () => {
                    selectFrom.value = preset.from;
                    selectTo.value = preset.to;
                    inputFrom.value = preset.val;
                    handleConversion('from');
                });
                presetsContainer.appendChild(btn);
            });
        }

        /**
         * Applies the vibrant color theme associated with the selected category
         */
        function applyCategoryTheme(category) {
            const theme = CATEGORY_THEMES[category];
            appBody.className = theme.bodyBg;
            orb1.className = theme.orb1;
            orb2.className = theme.orb2;
            orb3.className = theme.orb3;
            cardHeader.className = theme.headerGradient;
            themeBadgeText.textContent = theme.badgeText;
            headerHeroIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="${theme.heroIconPath}"></path>`;

            // Subtle bounce animation on hero icon badge
            headerIconBox.classList.add('scale-110', 'rotate-6');
            setTimeout(() => headerIconBox.classList.remove('scale-110', 'rotate-6'), 300);

            swapBtn.className = theme.swapBtn;
            toCard.className = theme.toCard;
            toLabel.className = theme.toLabel;
            inputTo.className = theme.toInputText;
            selectTo.className = theme.toSelectBorder;
            fromDot.className = theme.fromDot;
            toDot.className = theme.toDot;
            statusPulse.className = theme.pulseDot;
            formulaBadge.className = theme.formulaText;
        }

        /**
         * Populates dropdown selects for the active category
         */
        function populateUnitDropdowns(category) {
            const categoryConfig = CONVERSION_DATA[category];
            const units = categoryConfig.units;

            selectFrom.innerHTML = '';
            selectTo.innerHTML = '';

            Object.entries(units).forEach(([key, unitObj]) => {
                const optionFrom = document.createElement('option');
                optionFrom.value = key;
                optionFrom.textContent = unitObj.label;
                selectFrom.appendChild(optionFrom);

                const optionTo = document.createElement('option');
                optionTo.value = key;
                optionTo.textContent = unitObj.label;
                selectTo.appendChild(optionTo);
            });

            selectFrom.value = categoryConfig.defaultFrom;
            selectTo.value = categoryConfig.defaultTo;
            inputFrom.value = categoryConfig.defaultValue;
            handleConversion('from');
        }

        /**
         * Switches category, updates theme colors, tabs, dropdowns, and presets
         */
        function switchCategory(newCategory) {
            if (!CONVERSION_DATA[newCategory]) return;
            currentCategory = newCategory;
            const theme = CATEGORY_THEMES[newCategory];

            categoryTabs.forEach(tab => {
                const isSelected = tab.dataset.category === newCategory;
                tab.setAttribute('aria-selected', isSelected);
                tab.className = isSelected ? theme.tabActive : theme.tabInactive;
            });

            applyCategoryTheme(newCategory);
            populateUnitDropdowns(newCategory);
            renderPresets(newCategory);
        }

        /**
         * Swaps 'From' and 'To' units with icon spin animation
         */
        function swapUnits() {
            swapRotation += 180;
            swapIcon.style.transform = `rotate(${swapRotation}deg)`;

            const tempUnit = selectFrom.value;
            selectFrom.value = selectTo.value;
            selectTo.value = tempUnit;

            handleConversion('from');
        }

        /**
         * Shows a temporary toast notification
         */
        let toastTimeout;
        function showToast(message) {
            toastMessage.textContent = message;
            toastEl.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.add('translate-y-20', 'opacity-0');
            }, 2200);
        }

        /**
         * Copies the converted result to the clipboard
         */
        function copyResultToClipboard() {
            const resultVal = inputTo.value.trim();
            if (!resultVal) {
                showToast('Nothing to copy yet');
                return;
            }

            const units = CONVERSION_DATA[currentCategory].units;
            const toUnitSymbol = units[selectTo.value].symbol;
            const textToCopy = `${resultVal} ${toUnitSymbol}`;

            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = textToCopy;
            tempTextArea.style.position = 'fixed';
            tempTextArea.style.left = '-9999px';
            document.body.appendChild(tempTextArea);
            tempTextArea.select();

            try {
                document.execCommand('copy');
                copyText.textContent = 'Copied!';
                showToast(`Copied "${textToCopy}"`);
                setTimeout(() => {
                    copyText.textContent = 'Copy Result';
                }, 1800);
            } catch (err) {
                showToast('Unable to copy text');
            } finally {
                document.body.removeChild(tempTextArea);
            }
        }

        // Event Listeners
        categoryTabs.forEach(tab => {
            tab.addEventListener('click', () => switchCategory(tab.dataset.category));
        });

        inputFrom.addEventListener('input', () => handleConversion('from'));
        inputTo.addEventListener('input', () => handleConversion('to'));

        selectFrom.addEventListener('change', () => handleConversion(lastEditedSide));
        selectTo.addEventListener('change', () => handleConversion(lastEditedSide));

        swapBtn.addEventListener('click', swapUnits);
        copyBtn.addEventListener('click', copyResultToClipboard);

        clearBtn.addEventListener('click', () => {
            inputFrom.value = '';
            inputTo.value = '';
            inputFrom.focus();
            updateSummary();
        });

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            switchCategory('temperature');
        });
    </script>
</body>
</html>
